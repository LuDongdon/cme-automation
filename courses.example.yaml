# ============================================================
# 课程清单模板
# 使用方法：复制为 courses.yaml 后按需增删
#   copy courses.example.yaml courses.yaml
#
# courses.yaml 保存的是本机真实的课程与考勤状态，已被 .gitignore 忽略。
# status 字段会在建课/签到/签退/授分后由程序自动回写。
# ============================================================

metadata:
